name: Release Quint

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # Reusable workflows can't be granted more permissions than their caller has,
  # and the org default token has no `pull-requests` access, which the
  # `changes` jobs in these workflows request.
  unit-tests:
    uses: ./.github/workflows/test-quint.yml
    permissions:
      contents: read
      pull-requests: read

  integration-tests:
    uses: ./.github/workflows/integration-tests.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read

  release:
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./quint
    permissions:
      contents: write
      # Required for npm trusted publishing (OIDC) and provenance
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install node
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing requires npm >= 11.5.1, shipped with node 24
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Compile
        run: npm ci
      - name: Extract release notes
        # Get the release notes for the version by printing all lines between lines
        # starting with the version header and ending with the next version header,
        # inclusive. We then drop the last line to remove the subsequent version header.
        run: |
          version=$(npm pkg get version | sed 's/"//g')
          sed -n "/## v$version/,/## v/p" ../CHANGELOG.md | head -n -1 > ${{ github.workspace }}/release-notes.txt
      - name: Release
        # See https://github.com/softprops/action-gh-release#-external-release-notes
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ github.workspace }}/release-notes.txt
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        # See https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages#publishing-packages-to-the-npm-registry
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  wait-for-npm:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.npm-ready.outputs.version }}
    steps:
      - name: Wait for NPM
        id: npm-ready
        timeout-minutes: 30
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          while ! curl -s https://registry.npmjs.org/@informalsystems/quint | jq -er ".versions.\"${REF_NAME#v}\""; do
            echo "Waiting for NPM to publish version ${REF_NAME#v}..."
            sleep 30
          done
          echo "version=${REF_NAME#v}" >> $GITHUB_OUTPUT

  check-on-arch:
    strategy:
      matrix:
        os:
          # linux-amd64
          - ubuntu-22.04
          # linux-arm64
          - ubuntu-22.04-arm
          # macos-arm64
          - macos-latest
          # macos-intel
          - macos-15-intel
          # pc-amd64
          - windows-2022
    needs: wait-for-npm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Quint
        timeout-minutes: 30
        env:
          QUINT_VERSION: ${{ needs.wait-for-npm.outputs.version }}
        # can't use bash shell tricks, as it's not available on windows
        # --min-dep-age=0: Deno refuses npm versions younger than 24h by
        # default, and we are checking the version that was just published.
        run: |
          deno run --min-dep-age=0 --allow-all --node-modules-dir=auto --allow-scripts "npm:@informalsystems/quint@${{ env.QUINT_VERSION }}" --version
  upload-binaries:
    needs: check-on-arch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Upload assets
        env:
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/upload-binaries.sh "$GH_REPO" "$REF_NAME" --publish
